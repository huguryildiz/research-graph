name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q

  # The suite runs from a checkout, where every config file is a relative path
  # away. This job is the one that would have caught a wheel shipping no schemas.
  wheel:
    name: wheel install works away from the checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/python -m pip install dist/*.whl
      - name: Run it from somewhere that is not the repository
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/wheelenv/bin/rgraph --version
          /tmp/wheelenv/bin/rgraph --no-banner check --static
          /tmp/wheelenv/bin/rgraph --no-banner demo --scenario 1

  onboarding:
    name: a stranger reaches a green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: demo, setup, then demo again
        run: |
          rgraph --no-banner demo --scenario 1
          rgraph --no-banner setup --yes
          rgraph --no-banner demo --scenario 1   # setup must not break the demo
      - name: init, seal, first gate
        run: |
          rgraph --no-banner init
          rgraph --no-banner seal
          rgraph --no-banner check H1
