# Which provider runs which role. Copy to assignment.yaml and edit,
# or generate one with `rgraph setup`.
#
# The model strings are the identifiers the CLIs answer to, which is not always
# the name the model is sold under. `effort` is optional and sets reasoning
# depth wherever the provider declares an effort_argv in providers.yaml.
retrieval:    {provider: claude-code, model: claude-sonnet-5}
planning:     {provider: claude-code, model: claude-opus-5}
execution:    {provider: claude-code, model: claude-sonnet-5}
verification: {provider: codex,       model: gpt-5.6-terra}
synthesis:    {provider: claude-code, model: claude-fable-5}
reviewer:     {provider: grok,        model: grok-5}
